<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Spoofer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --glass:   rgba(22, 24, 30, 0.78);
  --line:    rgba(255, 255, 255, 0.08);
  --fill:    rgba(255, 255, 255, 0.06);
  --fill-h:  rgba(255, 255, 255, 0.11);
  --text:    #f2f3f5;
  --muted:   #9a9ca5;
  --blue:    #0a84ff;
  --green:   #30d158;
  --orange:  #ff9f0a;
  --red:     #ff453a;
  --r:       14px;
}

html, body {
  height: 100%;
  background: #111;
  color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

#map { position: fixed; inset: 0; }
.leaflet-container { background: #1b1d22; font: inherit; }
.leaflet-control-attribution { background: rgba(0,0,0,.5) !important; color: #888 !important; }
.leaflet-control-attribution a { color: #aaa !important; }
.leaflet-bar { border: none !important; box-shadow: 0 4px 20px rgba(0,0,0,.35) !important; }
.leaflet-bar a { background: var(--glass) !important; color: var(--text) !important; border-color: var(--line) !important; backdrop-filter: blur(20px); }

/* ── Floating panel ─────────────────────────────────────── */
#panel {
  position: fixed; top: 16px; left: 16px; bottom: 16px;
  width: 340px;
  display: flex; flex-direction: column; gap: 12px;
  z-index: 1000; pointer-events: none;
}
.card {
  pointer-events: auto;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

/* Device card */
.device { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.device-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--fill); display: grid; place-items: center; flex-shrink: 0;
}
.device-icon svg { width: 18px; height: 18px; }
.device-info { flex: 1; min-width: 0; }
.device-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.device-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.busy { background: var(--orange); animation: blink 1s infinite; }
.dot.off { background: var(--red); }
@keyframes blink { 50% { opacity: .3; } }

.icon-btn {
  background: var(--fill); color: var(--muted);
  border: none; border-radius: 9px; width: 32px; height: 32px;
  display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--fill-h); color: var(--text); }
.icon-btn svg { width: 15px; height: 15px; }

/* Main card */
.main { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

.seg {
  margin: 12px 12px 0; padding: 3px;
  background: rgba(0,0,0,.3); border-radius: 10px;
  display: grid; grid-template-columns: repeat(3, 1fr); position: relative;
}
.seg button {
  position: relative; z-index: 1;
  background: none; border: none; color: var(--muted);
  font: inherit; font-weight: 600; font-size: 12px;
  padding: 7px 0; border-radius: 8px; cursor: pointer; transition: color .2s;
}
.seg button.active { color: var(--text); }
.seg .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px;
  width: calc((100% - 6px) / 3);
  background: rgba(255,255,255,.12); border-radius: 8px;
  transition: transform .25s cubic-bezier(.3,.7,.4,1);
}

.pane { display: none; padding: 14px 12px; overflow-y: auto; flex: 1; }
.pane.active { display: flex; flex-direction: column; gap: 14px; }

/* Search */
.search { position: relative; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
input[type="text"] {
  width: 100%; background: var(--fill); border: 1px solid transparent;
  border-radius: 10px; color: var(--text); font: inherit; font-size: 14px;
  padding: 10px 12px 10px 34px; outline: none; transition: border-color .15s, background .15s;
}
input[type="text"]:focus { border-color: var(--blue); background: rgba(255,255,255,.04); }
input::placeholder { color: var(--muted); }
.suggest {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: #1e2027; border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; display: none; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.suggest.open { display: block; }

/* Lists */
.label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.label button { background: none; border: none; color: var(--blue); font: inherit; font-size: 11px; text-transform: none; letter-spacing: 0; cursor: pointer; }
.list { display: flex; flex-direction: column; gap: 2px; }
.item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 9px; cursor: pointer;
  background: none; border: none; color: var(--text); font: inherit; text-align: left; width: 100%;
  transition: background .12s;
}
.item:hover, .item.hl { background: var(--fill-h); }
.item .ic { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; flex-shrink: 0; color: var(--muted); }
.item .ic svg { width: 13px; height: 13px; }
.item .tx { flex: 1; min-width: 0; }
.item .t1 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .x { opacity: 0; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: 14px; }
.item:hover .x { opacity: 1; }
.empty { font-size: 12px; color: var(--muted); padding: 4px 2px; }

.hint { font-size: 12px; color: var(--muted); }

/* Current location box */
.here {
  background: var(--fill); border-radius: 10px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
}
.here .tx { flex: 1; min-width: 0; }
.here .t1 { font-size: 11px; color: var(--muted); }
.here .t2 { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 500; }

/* Buttons */
.btn {
  border: none; border-radius: 10px; font: inherit; font-weight: 600; font-size: 13px;
  padding: 10px 14px; cursor: pointer; transition: background .15s, opacity .15s, transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover:not(:disabled) { background: #2a94ff; }
.btn-ghost { background: var(--fill); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--fill-h); }
.btn-red { background: rgba(255,69,58,.15); color: var(--red); width: 100%; }
.btn-red:hover:not(:disabled) { background: rgba(255,69,58,.25); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

/* Slider */
.slider label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.slider label b { color: var(--text); font-weight: 600; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--fill-h); border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; }
.presets { display: flex; gap: 6px; margin-top: 10px; }
.presets button { flex: 1; background: var(--fill); border: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; padding: 6px 0; border-radius: 7px; cursor: pointer; }
.presets button.on { background: rgba(10,132,255,.2); color: var(--blue); }

/* Progress */
.progress { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--blue); transition: width 1s linear; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.check input { accent-color: var(--blue); }

/* Joystick */
.pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; margin: 4px auto; }
.pad button {
  background: var(--fill); border: none; border-radius: 12px; color: var(--muted);
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; touch-action: none;
  transition: background .08s, color .08s;
}
.pad button.on { background: var(--blue); color: #fff; }
.pad .compass { background: none; display: grid; place-items: center; color: var(--blue); font-size: 15px; font-weight: 700; cursor: default; }

.stop { padding: 12px; border-top: 1px solid var(--line); }

/* Map markers */
.me {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--blue); border: 3px solid #fff;
  box-shadow: 0 0 0 0 rgba(10,132,255,.6), 0 2px 8px rgba(0,0,0,.4);
  animation: ping 2s infinite;
}
.me.idle { background: #8e8e93; animation: none; }
@keyframes ping { 70% { box-shadow: 0 0 0 14px rgba(10,132,255,0), 0 2px 8px rgba(0,0,0,.4); } 100% { box-shadow: 0 0 0 0 rgba(10,132,255,0), 0 2px 8px rgba(0,0,0,.4); } }
.leaflet-marker-icon.glide { transition: transform 1s linear; }
.wp { width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #000; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.5); }

/* Toast */
#toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px;
  font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  animation: drop .25s cubic-bezier(.3,.7,.4,1); max-width: 480px;
}
.toast.error { color: #ff6961; }
.toast.ok { color: var(--green); }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } }

@media (max-width: 640px) {
  #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 60vh; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <!-- Device -->
  <div class="card device">
    <div class="device-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
    </div>
    <div class="device-info">
      <div class="device-name" id="dev-name">Looking for iPhone…</div>
      <div class="device-sub"><span class="dot busy" id="dev-dot"></span><span id="dev-sub">Plug in & unlock your phone</span></div>
    </div>
    <button class="icon-btn" id="btn-power" title="Disconnect" onclick="togglePower()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
    </button>
  </div>

  <!-- Main -->
  <div class="card main">
    <div class="seg" id="seg">
      <div class="thumb" id="thumb"></div>
      <button class="active" data-mode="teleport">Teleport</button>
      <button data-mode="path">Route</button>
      <button data-mode="joystick">Joystick</button>
    </div>

    <!-- Teleport -->
    <div class="pane active" id="pane-teleport">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="q" placeholder="Search a place or paste lat, lon" autocomplete="off">
        <div class="suggest list" id="suggest"></div>
      </div>

      <div class="here" id="here" style="display:none">
        <div class="tx"><div class="t1">Phone is at</div><div class="t2" id="here-coords">—</div></div>
        <button class="icon-btn" title="Save this spot" onclick="saveFavorite()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
        </button>
        <button class="icon-btn" title="Copy coordinates" onclick="copyCoords()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>

      <div class="hint">Click anywhere on the map to move your phone there.</div>

      <div>
        <div class="label">Saved</div>
        <div class="list" id="favs"></div>
      </div>
      <div>
        <div class="label">Recent <button onclick="clearRecents()">Clear</button></div>
        <div class="list" id="recents"></div>
      </div>
    </div>

    <!-- Route -->
    <div class="pane" id="pane-path">
      <div class="hint">Click the map to drop stops. Your phone moves along them at the speed you pick.</div>
      <div class="here">
        <div class="tx"><div class="t1">Stops</div><div class="t2" id="wp-info">0 stops</div></div>
        <button class="icon-btn" title="Undo last stop" onclick="undoWaypoint()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button class="icon-btn" title="Clear stops" onclick="clearWaypoints()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
      <div class="slider">
        <label>Speed <b id="speed-lbl"></b></label>
        <input type="range" id="speed" min="1" max="35" step="0.5" value="1.4">
        <div class="presets" id="speed-presets">
          <button data-v="1.4">Walk</button><button data-v="3">Run</button><button data-v="6">Bike</button><button data-v="15">Drive</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="loop"> Loop the route</label>
      <div class="progress"><div id="prog"></div></div>
      <button class="btn btn-blue" id="btn-walk" onclick="toggleWalk()" disabled>Start route</button>
    </div>

    <!-- Joystick -->
    <div class="pane" id="pane-joystick">
      <div class="hint">Hold W A S D / arrow keys, or press the pad. Combine keys for diagonals.</div>
      <div class="pad">
        <span></span><button data-k="up">W</button><span></span>
        <button data-k="left">A</button><span class="compass" id="compass">—</span><button data-k="right">D</button>
        <span></span><button data-k="down">S</button><span></span>
      </div>
      <div class="slider">
        <label>Speed <b id="joy-lbl"></b></label>
        <input type="range" id="joy" min="0.5" max="35" step="0.5" value="1.4">
        <div class="presets" id="joy-presets">
          <button data-v="1.4">Walk</button><button data-v="3">Run</button><button data-v="6">Bike</button><button data-v="15">Drive</button>
        </div>
      </div>
    </div>

    <div class="stop">
      <button class="btn btn-red" id="btn-stop" onclick="doStop()" disabled>Use real GPS again</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
// ── Helpers ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const fmt = (lat, lng) => `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── State ────────────────────────────────────────────────
let connected = false, connecting = false, userOff = false;
let mode = 'teleport';
let pos = store.get('lastPos', { lat: 37.7749, lng: -122.4194 });
let spoofing = false;

// ── Map ──────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([pos.lat, pos.lng], 14);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19,
}).addTo(map);

const meIcon = cls => L.divIcon({ className: '', html: `<div class="me ${cls}"></div>`, iconSize: [20, 20], iconAnchor: [10, 10] });
const me = L.marker([pos.lat, pos.lng], { icon: meIcon('idle'), zIndexOffset: 1000 }).addTo(map);

function setSpoofing(on) {
  spoofing = on;
  me.setIcon(meIcon(on ? '' : 'idle'));
  $('here').style.display = on ? 'flex' : 'none';
  $('btn-stop').disabled = !on || !connected;
}

map.on('click', e => {
  const { lat, lng } = e.latlng;
  if (mode === 'teleport') teleport(lat, lng);
  else if (mode === 'path') addWaypoint(lat, lng);
});

// ── API ──────────────────────────────────────────────────
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// Sends a location; if the phone dropped, reconnects once and retries.
async function sendLocation(lat, lng, { quiet = false } = {}) {
  if (!connected) { if (!quiet) toast('Waiting for iPhone… plug it in and unlock it', 'error'); return false; }
  try {
    await api('/api/location', { lat, lon: lng });
  } catch (e) {
    setConn('busy');
    if (!(await connect(true))) { if (!quiet) toast('Lost the phone: ' + e.message, 'error'); return false; }
    try { await api('/api/location', { lat, lon: lng }); }
    catch (e2) { if (!quiet) toast(e2.message, 'error'); return false; }
  }
  pos = { lat, lng };
  store.set('lastPos', pos);
  me.setLatLng([lat, lng]);
  $('here-coords').textContent = fmt(lat, lng);
  setSpoofing(true);
  return true;
}

// ── Connection (auto) ────────────────────────────────────
function setConn(state, info = {}) {
  const dot = $('dev-dot');
  dot.className = 'dot ' + ({ on: 'on', busy: 'busy', off: 'off' })[state];
  if (state === 'on') {
    $('dev-name').textContent = info.device || 'iPhone';
    $('dev-sub').textContent = info.ios ? `Connected · iOS ${info.ios}` : 'Connected';
  } else if (state === 'busy') {
    $('dev-name').textContent = 'Connecting…';
    $('dev-sub').textContent = 'Keep your phone unlocked';
  } else {
    $('dev-name').textContent = userOff ? 'Disconnected' : 'Looking for iPhone…';
    $('dev-sub').textContent = userOff ? 'Click power to reconnect' : 'Plug in by USB and unlock it';
  }
  $('btn-power').title = state === 'on' ? 'Disconnect' : 'Connect';
  $('btn-power').style.color = state === 'on' ? 'var(--green)' : '';
  $('btn-stop').disabled = !(state === 'on' && spoofing);
  updateWalkBtn();
}

async function connect(silent = false) {
  if (connecting) return connected;
  connecting = true;
  setConn('busy');
  try {
    const data = await api('/api/connect', {});
    const was = connected;
    connected = true;
    setConn('on', data);
    if (!was && !silent) toast(`Connected to ${data.device || 'iPhone'}`, 'ok');
    if (data.lat != null) { pos = { lat: data.lat, lng: data.lon }; me.setLatLng([data.lat, data.lon]); $('here-coords').textContent = fmt(data.lat, data.lon); setSpoofing(true); }
  } catch (e) {
    connected = false;
    setConn('off');
    if (!silent) toast(e.message.split('\n')[0], 'error');
  } finally {
    connecting = false;
  }
  return connected;
}

async function togglePower() {
  if (connected) {
    userOff = true;
    stopWalk(); stopJoystick();
    await api('/api/disconnect', {}).catch(() => {});
    connected = false; setSpoofing(false); setConn('off');
    toast('Disconnected — phone is back on real GPS');
  } else {
    userOff = false;
    connect();
  }
}

// Keep trying in the background until a phone shows up; notice if it drops.
async function watchdog() {
  if (!connecting && !userOff) {
    try {
      const s = await api('/api/status');
      if (!s.connected && connected) { connected = false; setConn('off'); }
      if (!s.connected) await connect(true).then(ok => ok && toast(`Connected to ${$('dev-name').textContent}`, 'ok'));
    } catch { /* server not up yet */ }
  }
  setTimeout(watchdog, connected ? 4000 : 3000);
}

async function doStop() {
  stopWalk(); stopJoystick();
  try { await api('/api/stop', {}); setSpoofing(false); toast('Phone is using real GPS again', 'ok'); }
  catch (e) { toast(e.message, 'error'); }
}

// ── Mode switch ──────────────────────────────────────────
document.querySelectorAll('#seg button').forEach((b, i) => b.onclick = () => {
  if (mode === 'path') stopWalk();
  if (mode === 'joystick') stopJoystick();
  mode = b.dataset.mode;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('active', x === b));
  $('thumb').style.transform = `translateX(${i * 100}%)`;
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + mode));
  map.getContainer().style.cursor = mode === 'joystick' ? '' : 'crosshair';
  if (mode === 'joystick') startJoystick();
});
map.getContainer().style.cursor = 'crosshair';

// ── Teleport, search, saved, recent ──────────────────────
async function teleport(lat, lng, name) {
  if (await sendLocation(lat, lng)) {
    map.panTo([lat, lng]);
    addRecent({ lat, lng, name: name || fmt(lat, lng) });
  }
}

let favs = store.get('favs', []);
let recents = store.get('recents', []);

function itemHTML(p, i, kind) {
  const icon = kind === 'fav'
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  return `<div class="item" data-kind="${kind}" data-i="${i}"><span class="ic">${icon}</span>
    <span class="tx"><div class="t1">${esc(p.name)}</div><div class="t2">${fmt(p.lat, p.lng)}</div></span>
    <button class="x" title="Remove" data-rm="1">✕</button></div>`;
}
function renderLists() {
  $('favs').innerHTML = favs.length ? favs.map((p, i) => itemHTML(p, i, 'fav')).join('') : '<div class="empty">Star a spot to save it here.</div>';
  $('recents').innerHTML = recents.length ? recents.map((p, i) => itemHTML(p, i, 'recent')).join('') : '<div class="empty">Places you visit show up here.</div>';
}
document.addEventListener('click', e => {
  const it = e.target.closest('.item[data-kind]');
  if (!it) return;
  const list = it.dataset.kind === 'fav' ? favs : recents;
  const i = +it.dataset.i;
  if (e.target.closest('[data-rm]')) {
    list.splice(i, 1);
    store.set(it.dataset.kind === 'fav' ? 'favs' : 'recents', list);
    renderLists();
    return;
  }
  const p = list[i];
  map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15));
  teleport(p.lat, p.lng, p.name);
});
function addRecent(p) {
  recents = [p, ...recents.filter(r => fmt(r.lat, r.lng) !== fmt(p.lat, p.lng))].slice(0, 6);
  store.set('recents', recents);
  renderLists();
}
function clearRecents() { recents = []; store.set('recents', recents); renderLists(); }
function saveFavorite() {
  const name = prompt('Name this spot', recents[0]?.name || fmt(pos.lat, pos.lng));
  if (!name) return;
  favs.unshift({ lat: pos.lat, lng: pos.lng, name });
  store.set('favs', favs);
  renderLists();
  toast('Saved', 'ok');
}
function copyCoords() { navigator.clipboard?.writeText(fmt(pos.lat, pos.lng)); toast('Copied'); }

// Search with live suggestions (Nominatim, debounced to respect its rate limit)
let qTimer, results = [], hl = -1;
const q = $('q'), sug = $('suggest');
q.addEventListener('input', () => {
  clearTimeout(qTimer);
  const v = q.value.trim();
  const m = v.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) { results = [{ lat: +m[1], lng: +m[2], name: 'Go to coordinates', sub: fmt(+m[1], +m[2]) }]; showSuggest(); return; }
  if (v.length < 3) { sug.classList.remove('open'); return; }
  qTimer = setTimeout(async () => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(v)}`, { headers: { 'Accept-Language': 'en' } });
      const d = await r.json();
      if (q.value.trim() !== v) return;
      results = d.map(x => {
        const parts = x.display_name.split(', ');
        return { lat: +x.lat, lng: +x.lon, name: parts[0], sub: parts.slice(1, 4).join(', ') };
      });
      showSuggest();
    } catch { /* offline */ }
  }, 450);
});
function showSuggest() {
  hl = results.length ? 0 : -1;
  sug.innerHTML = results.length
    ? results.map((r, i) => `<button class="item${i === hl ? ' hl' : ''}" data-s="${i}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span><span class="tx"><div class="t1">${esc(r.name)}</div><div class="t2">${esc(r.sub || '')}</div></span></button>`).join('')
    : '<div class="empty" style="padding:10px">No results</div>';
  sug.classList.add('open');
}
function pickSuggest(i) {
  const r = results[i];
  if (!r) return;
  sug.classList.remove('open');
  q.value = ''; q.blur();
  map.setView([r.lat, r.lng], 16);
  teleport(r.lat, r.lng, r.name);
}
sug.addEventListener('mousedown', e => { const b = e.target.closest('[data-s]'); if (b) { e.preventDefault(); pickSuggest(+b.dataset.s); } });
q.addEventListener('keydown', e => {
  if (!sug.classList.contains('open')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
    sug.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('hl', i === hl));
  } else if (e.key === 'Enter') { e.preventDefault(); pickSuggest(hl); }
  else if (e.key === 'Escape') sug.classList.remove('open');
});
q.addEventListener('blur', () => setTimeout(() => sug.classList.remove('open'), 100));

// ── Route ────────────────────────────────────────────────
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function step(p, headingDeg, m) {
  const d = m / R, br = rad(headingDeg), la1 = rad(p.lat), lo1 = rad(p.lng);
  const la2 = Math.asin(Math.sin(la1) * Math.cos(d) + Math.cos(la1) * Math.sin(d) * Math.cos(br));
  const lo2 = lo1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la1), Math.cos(d) - Math.sin(la1) * Math.sin(la2));
  return { lat: deg(la2), lng: deg(lo2) };
}

let wps = [], wpMarkers = [], line = null, walkTimer = null, walkPath = [], walkI = 0;

function redrawRoute() {
  if (line) map.removeLayer(line);
  line = wps.length > 1 ? L.polyline(wps.map(w => [w.lat, w.lng]), { color: '#0a84ff', weight: 4, opacity: .85 }).addTo(map) : null;
  let total = 0;
  for (let i = 1; i < wps.length; i++) total += dist(wps[i - 1], wps[i]);
  const km = total >= 1000 ? (total / 1000).toFixed(2) + ' km' : Math.round(total) + ' m';
  const secs = total / +$('speed').value;
  const t = secs >= 3600 ? `${Math.floor(secs / 3600)}h ${Math.round(secs % 3600 / 60)}m` : `${Math.max(1, Math.round(secs / 60))} min`;
  $('wp-info').textContent = wps.length < 2 ? `${wps.length} stop${wps.length === 1 ? '' : 's'}` : `${wps.length} stops · ${km} · ~${t}`;
  updateWalkBtn();
}
function addWaypoint(lat, lng) {
  wps.push({ lat, lng });
  const icon = L.divIcon({ className: '', html: `<div class="wp">${wps.length}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
  wpMarkers.push(L.marker([lat, lng], { icon }).addTo(map));
  redrawRoute();
}
function undoWaypoint() { if (!wps.length) return; stopWalk(); wps.pop(); map.removeLayer(wpMarkers.pop()); redrawRoute(); }
function clearWaypoints() { stopWalk(); wps = []; wpMarkers.forEach(m => map.removeLayer(m)); wpMarkers = []; redrawRoute(); $('prog').style.width = '0'; }

function updateWalkBtn() { $('btn-walk').disabled = !walkTimer && (wps.length < 2 || !connected); }

function toggleWalk() { walkTimer ? stopWalk() : startWalk(); }
function startWalk() {
  const speed = +$('speed').value;
  walkPath = [];
  for (let i = 0; i < wps.length - 1; i++) {
    const n = Math.max(1, Math.round(dist(wps[i], wps[i + 1]) / speed));
    for (let s = 0; s < n; s++) walkPath.push({ lat: wps[i].lat + (wps[i + 1].lat - wps[i].lat) * s / n, lng: wps[i].lng + (wps[i + 1].lng - wps[i].lng) * s / n });
  }
  walkPath.push(wps[wps.length - 1]);
  walkI = 0;
  me.getElement()?.classList.add('glide');
  $('btn-walk').textContent = 'Pause route';
  const tick = async () => {
    if (walkI >= walkPath.length) {
      if ($('loop').checked) { walkPath.reverse(); walkI = 0; }
      else { stopWalk(); toast('Route finished', 'ok'); return; }
    }
    const p = walkPath[walkI++];
    $('prog').style.width = (walkI / walkPath.length * 100) + '%';
    await sendLocation(p.lat, p.lng, { quiet: true });
    if (!map.getBounds().pad(-0.2).contains([p.lat, p.lng])) map.panTo([p.lat, p.lng]);
  };
  tick();
  walkTimer = setInterval(tick, 1000);
}
function stopWalk() {
  if (walkTimer) { clearInterval(walkTimer); walkTimer = null; }
  me.getElement()?.classList.remove('glide');
  $('btn-walk').textContent = 'Start route';
  updateWalkBtn();
}

// ── Speed sliders ────────────────────────────────────────
function bindSpeed(sliderId, labelId, presetsId, onChange) {
  const s = $(sliderId);
  const update = () => {
    const v = +s.value;
    $(labelId).textContent = `${v} m/s · ${Math.round(v * 3.6)} km/h`;
    document.querySelectorAll(`#${presetsId} button`).forEach(b => b.classList.toggle('on', +b.dataset.v === v));
    onChange?.();
  };
  s.oninput = update;
  document.querySelectorAll(`#${presetsId} button`).forEach(b => b.onclick = () => { s.value = b.dataset.v; update(); });
  update();
}
bindSpeed('speed', 'speed-lbl', 'speed-presets', () => wps && redrawRoute());
bindSpeed('joy', 'joy-lbl', 'joy-presets');

// ── Joystick ─────────────────────────────────────────────
const held = new Set();
const KEYS = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
const VEC = { up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0] };
let joyTimer = null;

function paintPad() { document.querySelectorAll('.pad [data-k]').forEach(b => b.classList.toggle('on', held.has(b.dataset.k))); }
function startJoystick() { if (!joyTimer) joyTimer = setInterval(joyTick, 1000); }
function stopJoystick() { clearInterval(joyTimer); joyTimer = null; held.clear(); paintPad(); }
function joyTick() {
  let x = 0, y = 0;
  held.forEach(k => { x += VEC[k][0]; y += VEC[k][1]; });
  if (!x && !y) return;
  const heading = (deg(Math.atan2(x, y)) + 360) % 360;
  $('compass').textContent = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(heading / 45) % 8];
  const next = step(pos, heading, +$('joy').value);
  sendLocation(next.lat, next.lng, { quiet: true });
  if (!map.getBounds().pad(-0.2).contains([next.lat, next.lng])) map.panTo([next.lat, next.lng]);
}
document.addEventListener('keydown', e => {
  if (mode !== 'joystick' || e.target.tagName === 'INPUT' || !KEYS[e.code]) return;
  e.preventDefault();
  const first = !held.has(KEYS[e.code]);
  held.add(KEYS[e.code]); paintPad();
  if (first && held.size === 1) joyTick(); // react instantly on first press
});
document.addEventListener('keyup', e => { if (KEYS[e.code]) { held.delete(KEYS[e.code]); paintPad(); } });
window.addEventListener('blur', () => { held.clear(); paintPad(); });
document.querySelectorAll('.pad [data-k]').forEach(b => {
  b.onpointerdown = () => { held.add(b.dataset.k); paintPad(); joyTick(); };
  b.onpointerup = b.onpointerleave = () => { held.delete(b.dataset.k); paintPad(); };
});

// ── Init ─────────────────────────────────────────────────
renderLists();
setConn('busy');
watchdog();
</script>
</body>
